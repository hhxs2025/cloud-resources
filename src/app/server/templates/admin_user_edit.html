{% extends "layout.html" %}
{% block content %}
<div class="flex-between mb-10">
    <h2 style="font-size: 20px; font-weight: 600;">编辑用户权限</h2>
    <a href="{{ url_for('admin_users') }}" class="btn">返回列表</a>
</div>

<div class="card">
    {% if not is_app_activated %}
    <div class="alert alert-warning">
        下载权限功能需要 <a href="{{ url_for('admin_license') }}" style="color: var(--primary); text-decoration: underline;">激活应用</a> 后才能使用。
    </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" value="{{ user.username }}" disabled style="background: #fafafa; cursor: not-allowed;">
        </div>

        <div class="form-group wide">
            <label>允许下载的分类</label>
            {% if is_app_activated %}
            <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px;">
                {% for c in categories %}
                <label style="display: flex; align-items: center; cursor: pointer; background: #fafafa; border: 1px solid var(--border-dark); padding: 6px 16px; border-radius: 6px; margin-bottom: 0;">
                    <input type="checkbox" name="download_categories" value="{{ c.id }}"
                        {% if c.id|string in (user.download_categories or '').split(',') %}checked{% endif %}>
                    {{ c.name }}
                </label>
                {% endfor %}
            </div>
            <div class="text-muted" style="margin-top: 12px;">不勾选=允许全部，勾选=只允许勾选的分类</div>
            {% else %}
            <div class="text-muted" style="padding: 16px 0;">未激活应用，无法配置权限</div>
            {% endif %}
        </div>

        <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);">
            <button type="submit" class="btn btn-primary" {% if not is_app_activated %}disabled style="opacity:0.5;cursor:not-allowed;"{% endif %}>保存权限设置</button>
        </div>
    </form>
</div>
{% endblock %}
