{% extends "layout.html" %}
{% block content %}
<div class="flex-between mb-10">
    <h2 style="color: #1e293b; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 19px;">📄</span> 添加资源
    </h2>
    <a href="{{ url_for('admin_resources') }}" class="btn btn-outline btn-sm">← 返回</a>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('admin_add_resource') }}" enctype="multipart/form-data">
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 500; font-size: 13px; color: #475569; margin-bottom: 3px;">标题 *</label>
            <input type="text" name="title" required style="width: 100%; padding: 7px 12px; border: 1px solid #d1d9e6; border-radius: 6px; font-size: 14px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 500; font-size: 13px; color: #475569; margin-bottom: 3px;">分类</label>
            <select name="category_id" style="width: 100%; padding: 7px 12px; border: 1px solid #d1d9e6; border-radius: 6px; font-size: 14px;">
                <option value="">选择分类</option>
                {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 500; font-size: 13px; color: #475569; margin-bottom: 3px;">文件 *</label>
            <input type="file" name="file" required style="padding: 4px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 500; font-size: 13px; color: #475569; margin-bottom: 3px;">描述（支持 Markdown）</label>
            <textarea name="description" style="width: 100%; min-height: 100px; padding: 7px 12px; border: 1px solid #d1d9e6; border-radius: 6px; font-size: 14px; font-family: monospace;"></textarea>
        </div>

        <!-- ===== 标签区域（修复：复选框+标签名横排，左对齐） ===== -->
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 500; font-size: 13px; color: #475569; margin-bottom: 4px;">标签</label>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                {% for t in tags %}
                <label style="font-weight: normal; font-size: 13px; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; background: #f8fafc; padding: 3px 12px 3px 8px; border-radius: 4px; border: 1px solid #e8edf2;">
                    <input type="checkbox" name="tag_ids" value="{{ t.id }}">
                    {{ t.name }}
                </label>
                {% endfor %}
            </div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">不勾选则不加标签</div>
        </div>

        <!-- ===== 批量上传区域 ===== -->
        <div style="margin: 16px 0; padding: 14px 16px; background: #f0f7ff; border-radius: 6px; border: 1px dashed #2563eb;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                <span style="font-size: 16px;">📁</span>
                <strong style="font-size: 14px; color: #1e293b;">批量上传</strong>
                <span style="font-size: 12px; color: #94a3b8;">（选多个文件，每个自动创建资源）</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
                <input type="file" name="batch_files" multiple style="padding: 4px; font-size: 13px; flex: 1; min-width: 180px;">
                <input type="text" name="title_prefix" placeholder="标题前缀（可选）" style="padding: 5px 10px; border: 1px solid #d1d9e6; border-radius: 6px; font-size: 13px; width: 140px;">
                <button type="submit" formaction="{{ url_for('admin_add_resources_batch') }}" class="btn btn-success btn-sm">🚀批量提交</button>
            </div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">
                💡文件名作为标题，支持同时选多个文件
            </div>
        </div>

        <button type="submit" class="btn btn-success">提交</button>
    </form>
</div>
{% endblock %}
