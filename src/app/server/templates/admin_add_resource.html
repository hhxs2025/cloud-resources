{% extends "layout.html" %}
{% block content %}
<div class="flex-between mb-10">
    <h2 style="font-size: 20px; font-weight: 600;">添加资源</h2>
    <a href="{{ url_for('admin_resources') }}" class="btn">返回</a>
</div>

<div class="card">
    <!-- 进度条 -->
    <div id="progress-wrapper" style="display: none; margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px;">
            <span id="progress-text">上传中...</span>
            <span id="progress-percent">0%</span>
        </div>
        <div style="width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden;">
            <div id="progress-bar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s;"></div>
        </div>
        <div id="progress-status" style="margin-top: 8px; font-size: 12px; color: var(--text-muted);"></div>
    </div>

    <div style="margin-bottom: 24px;">
        <label>上传方式</label>
        <select id="mode-select" style="max-width: 200px;">
            <option value="single">单个上传</option>
            <option value="batch">批量上传</option>
        </select>
    </div>

    <!-- 单文件 -->
    <form id="form-single" method="POST" action="{{ url_for('admin_add_resource') }}" enctype="multipart/form-data" class="upload-form">
        <div class="form-group">
            <label>资源标题 *</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>分类</label>
            <select name="category_id">
                <option value="">选择分类</option>
                {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>选择文件 *</label>
            <input type="file" name="file" required style="border: none; padding: 0;">
        </div>
        <div class="form-group wide">
            <label>资源描述 (支持 Markdown)</label>
            <textarea name="description" style="min-height: 120px;"></textarea>
        </div>
        <div class="form-group">
            <label>标签</label>
            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                {% for t in tags %}
                <label style="display: flex; align-items: center; cursor: pointer; margin-bottom: 0;">
                    <input type="checkbox" name="tag_ids" value="{{ t.id }}"> {{ t.name }}
                </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">提交资源</button>
    </form>

    <!-- 批量 -->
    <form id="form-batch" method="POST" action="{{ url_for('admin_add_resources_batch') }}" enctype="multipart/form-data" class="upload-form" style="display: none;">
        <div class="form-group">
            <label>分类</label>
            <select name="category_id">
                <option value="">选择分类</option>
                {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>标题前缀 (可选)</label>
            <input type="text" name="title_prefix" placeholder="例如：教程-">
        </div>
        <div class="form-group">
            <label>选择多个文件 *</label>
            <input type="file" name="batch_files" multiple required style="border: none; padding: 0;">
        </div>
        <div class="form-group wide">
            <label>统一描述 (可选)</label>
            <textarea name="description" style="min-height: 80px;"></textarea>
        </div>
        <div class="form-group">
            <label>标签</label>
            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                {% for t in tags %}
                <label style="display: flex; align-items: center; cursor: pointer; margin-bottom: 0;">
                    <input type="checkbox" name="tag_ids" value="{{ t.id }}"> {{ t.name }}
                </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">批量导入</button>
    </form>
</div>

<script>
document.getElementById('mode-select').addEventListener('change', function() {
    var val = this.value;
    document.getElementById('form-single').style.display = val === 'single' ? 'block' : 'none';
    document.getElementById('form-batch').style.display = val === 'batch' ? 'block' : 'none';
});

(function() {
    var forms = document.querySelectorAll('.upload-form');
    var wrapper = document.getElementById('progress-wrapper');
    var bar = document.getElementById('progress-bar');
    var text = document.getElementById('progress-text');
    var percent = document.getElementById('progress-percent');
    var status = document.getElementById('progress-status');

    forms.forEach(function(form) {
        form.addEventListener('submit', function(e) {
            var files = form.querySelector('input[type="file"]').files;
            if (!files || files.length === 0) return;

            var hasLarge = false;
            var total = 0;
            for (var i = 0; i < files.length; i++) {
                total += files[i].size;
                if (files[i].size > 5 * 1024 * 1024) hasLarge = true;
            }
            if (!hasLarge && files.length <= 5) return; // 小文件直接提交

            e.preventDefault();
            wrapper.style.display = 'block';
            bar.style.width = '0%';
            percent.textContent = '0%';
            text.textContent = '正在上传...';
            status.textContent = '共 ' + files.length + ' 个文件，总计 ' + (total/1024/1024).toFixed(2) + ' MB';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', form.action, true);

            xhr.upload.addEventListener('progress', function(ev) {
                if (ev.lengthComputable) {
                    var p = Math.round((ev.loaded / ev.total) * 100);
                    bar.style.width = p + '%';
                    percent.textContent = p + '%';
                }
            });

            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    bar.style.width = '100%';
                    percent.textContent = '100%';
                    text.textContent = '上传完成';
                    window.location.href = '{{ url_for("admin_resources") }}';
                } else {
                    text.textContent = '上传失败';
                    bar.style.background = 'var(--danger)';
                }
            };
            xhr.onerror = function() { text.textContent = '网络错误'; };
            xhr.send(new FormData(form));
        });
    });
})();
</script>
{% endblock %}
