{% extends "layout.html" %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card" style="padding: 32px;">
        <h2 style="text-align: center; font-size: 24px; font-weight: 600; margin-bottom: 8px;">登录</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 32px;">账号由管理员分配</p>
        
        <form method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; height: 40px; font-size: 16px; margin-top: 8px;">登 录</button>
        </form>
    </div>
</div>
{% endblock %}
