{% extends "layout.html" %}
{% block content %}
<div class="card">
    <h2>关于我们</h2>
    <div style="line-height: 1.8; color: #475569; font-size: 15px;">
        {% if config and config.about_content %}
            {{ config.about_content|markdown|safe }}
        {% else %}
            <p>暂无介绍，请在 <a href="{{ url_for('admin_settings') }}" style="color: #2563eb;">站点设置</a> 中添加。</p>
        {% endif %}
    </div>
</div>
{% endblock %}
