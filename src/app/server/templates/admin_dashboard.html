{% extends "layout.html" %}
{% block content %}
<div class="flex-between mb-10">
    <h2 style="font-size: 20px; font-weight: 600;">管理后台</h2>
</div>

<div class="card">
    <div class="card-title">快捷操作</div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
        <a href="{{ url_for('admin_resources') }}" class="btn" style="height: 48px;">资源管理</a>
        <a href="{{ url_for('admin_add_resource_page') }}" class="btn btn-primary" style="height: 48px;">添加资源</a>
        <a href="{{ url_for('admin_users') }}" class="btn" style="height: 48px;">用户管理</a>
        <a href="{{ url_for('admin_settings') }}" class="btn" style="height: 48px;">站点设置</a>
    </div>
</div>

<div class="card">
    <div class="card-title">数据统计</div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center;">
        <div>
            <div style="font-size: 32px; font-weight: bold; color: var(--text-main);">{{ resource_count }}</div>
            <div class="text-muted">资源总数</div>
        </div>
        <div>
            <div style="font-size: 32px; font-weight: bold; color: var(--text-main);">{{ user_count }}</div>
            <div class="text-muted">用户总数</div>
        </div>
        <div>
            <div style="font-size: 32px; font-weight: bold; color: var(--text-main);">{{ categories|count }}</div>
            <div class="text-muted">分类总数</div>
        </div>
    </div>
</div>
{% endblock %}
