{% extends "layout.html" %}
{% block content %}
<div class="flex-between mb-10">
    <h2 style="color: #1e293b; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 19px;">⚙️</span> 管理后台
    </h2>
</div>

<!-- ===== 功能菜单（顶部） ===== -->
<div class="card">
    <h2 style="font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #e8edf2;">📋 功能菜单</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;">
        <a href="{{ url_for('admin_resources') }}" class="btn btn-outline" style="justify-content: center; padding: 10px 16px;">📂 资源管理</a>
        <a href="{{ url_for('admin_add_resource_page') }}" class="btn btn-success" style="justify-content: center; padding: 10px 16px;">➕ 添加资源</a>
        <a href="{{ url_for('admin_users') }}" class="btn btn-outline" style="justify-content: center; padding: 10px 16px;">👤 用户管理</a>
        <a href="{{ url_for('admin_settings') }}" class="btn btn-outline" style="justify-content: center; padding: 10px 16px;">⚙️ 站点设置</a>
    </div>
</div>

<!-- ===== 统计信息（移到下方） ===== -->
<div class="card" style="margin-top: 18px;">
    <h2 style="font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #e8edf2;">📊 数据统计</h2>
    <div class="grid-3">
        <div class="text-center" style="padding: 8px 0;">
            <div style="font-size: 28px; font-weight: bold; color: #1e293b;">{{ resource_count }}</div>
            <div class="text-muted" style="font-size: 14px; margin-top: 2px;">资源总数</div>
        </div>
        <div class="text-center" style="padding: 8px 0;">
            <div style="font-size: 28px; font-weight: bold; color: #1e293b;">{{ user_count }}</div>
            <div class="text-muted" style="font-size: 14px; margin-top: 2px;">用户总数</div>
        </div>
        <div class="text-center" style="padding: 8px 0;">
            <div style="font-size: 28px; font-weight: bold; color: #1e293b;">{{ categories|count }}</div>
            <div class="text-muted" style="font-size: 14px; margin-top: 2px;">分类数</div>
        </div>
    </div>
</div>

<!-- ===== 快捷操作提示 ===== -->
<div class="card" style="background: #f0f7ff; border-color: #b8d4f0;">
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span style="font-size: 20px;">💡</span>
        <span style="font-size: 13px; color: #1e3a5f;">提示：修改密码请在「用户管理」页面操作，管理员不可禁用自己的账户。</span>
    </div>
</div>
{% endblock %}
