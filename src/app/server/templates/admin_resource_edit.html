{% extends "layout.html" %}
{% block content %}
<div class="flex-between mb-10">
    <h2 style="font-size: 20px; font-weight: 600;">编辑资源</h2>
    <a href="{{ url_for('admin_resources') }}" class="btn">返回</a>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>资源标题 *</label>
            <input type="text" name="title" value="{{ resource.title }}" required>
        </div>
        <div class="form-group">
            <label>分类</label>
            <select name="category_id">
                <option value="">选择分类</option>
                {% for c in categories %}
                    <option value="{{ c.id }}" {% if resource.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group wide">
            <label>资源描述 (支持 Markdown)</label>
            <textarea name="description" style="min-height: 150px;">{{ resource.description }}</textarea>
        </div>
        <div class="form-group">
            <label>标签</label>
            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                {% for t in tags %}
                <label style="display: flex; align-items: center; cursor: pointer; margin-bottom: 0;">
                    <input type="checkbox" name="tag_ids" value="{{ t.id }}" {% if t in resource.tags %}checked{% endif %}> {{ t.name }}
                </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>

<div class="card" style="border-left: 4px solid var(--primary);">
    <div class="card-title">替换文件</div>
    <div style="margin-bottom: 16px; font-size: 14px; color: var(--text-sec);">
        当前文件：<span style="font-weight: 500; color: var(--text-main);">{{ resource.file_name }}</span> ({{ resource.file_size|filesizeformat }})
    </div>
    <form method="POST" action="{{ url_for('admin_replace_file', resource_id=resource.id) }}" enctype="multipart/form-data" style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
        <input type="file" name="file" required style="border: none; padding: 0; flex: 1; max-width: 300px;">
        <button type="submit" class="btn btn-primary" onclick="return confirm('确定替换文件吗？旧文件将被删除。')">替换并删除旧文件</button>
    </form>
</div>
{% endblock %}
